version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci-deps
