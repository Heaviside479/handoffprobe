name: npm Stage

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to stage
        required: true
        type: string
      tag:
        description: npm dist-tag for the staged version
        required: true
        default: latest
        type: string
      confirm:
        description: Type STAGE to continue
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-stage
  cancel-in-progress: false

jobs:
  stage:
    name: Stage npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      REQUESTED_TAG: ${{ inputs.tag }}
      STAGE_CONFIRMATION: ${{ inputs.confirm }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pinned npm
        run: npm install --global npm@11.19.1

      - name: Validate stage request
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = "refs/heads/main"
          test "$STAGE_CONFIRMATION" = "STAGE"
          test "$(npm --version)" = "11.19.1"

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          CONTENT_CLASS="$(node -p "require('./package.json').contentPolicy?.class ?? ''")"

          test "$PACKAGE_NAME" = "handoffprobe"
          test "$PACKAGE_VERSION" = "$REQUESTED_VERSION"
          test "$CONTENT_CLASS" = "dual-use"
          test -f DISCLOSURE
          test -s DISCLOSURE

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "Refusing to stage an already-published version: $PACKAGE_NAME@$PACKAGE_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Repository quality gates
        run: npm run check

      - name: Verify publication payload
        shell: bash
        run: |
          set -euo pipefail

          PACK_JSON="$RUNNER_TEMP/handoffprobe-stage-pack.json"
          npm pack --dry-run --json > "$PACK_JSON"

          node - "$PACK_JSON" <<'NODE'
          const fs = require('node:fs');

          const path = process.argv[2];
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const files = data[0]?.files ?? [];
          const paths = new Set(files.map((entry) => entry.path));

          const required = [
            'LICENSE',
            'DISCLOSURE',
            'README.md',
            'package.json',
            'dist/cli.js',
            'dist/index.js',
          ];

          for (const requiredPath of required) {
            if (!paths.has(requiredPath)) {
              console.error(`Missing publication payload file: ${requiredPath}`);
              process.exit(1);
            }
          }
          NODE

      - name: Stage package on npm
        shell: bash
        run: |
          set -euo pipefail
          npm stage publish --access public --tag "$REQUESTED_TAG"
