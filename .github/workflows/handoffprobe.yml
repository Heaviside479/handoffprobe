name: HandoffProbe

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  handoffprobe:
    name: HandoffProbe
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run HandoffProbe
        id: handoffprobe
        uses: ./
        with:
          target: secure
          fail-on: high
          artifact-name: handoffprobe-report
