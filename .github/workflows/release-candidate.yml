name: Release Candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-candidate.yml
      - package.json
      - package-lock.json
      - src/**
      - tests/**
      - scripts/**
      - action.yml
      - compatibility-matrix.json
      - tsconfig.json
      - tsconfig.build.json

permissions:
  contents: read

jobs:
  release-candidate:
    name: Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install pinned npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"

      - name: Install dependencies
        run: npm ci

      - name: Repository quality gates
        run: npm run check

      - name: Build release candidate tarball
        shell: bash
        run: |
          set -euo pipefail

          RC_DIR="$RUNNER_TEMP/handoffprobe-release-candidate"
          mkdir -p "$RC_DIR"

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          npm pack --pack-destination "$RC_DIR"

          TARBALL="$RC_DIR/handoffprobe-$PACKAGE_VERSION.tgz"

          test -f "$TARBALL"

          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

          echo "Candidate: $TARBALL"
          sha256sum "$TARBALL"

      - name: Verify release artifact reproducibility
        shell: bash
        run: |
          set -euo pipefail

          REPRO_ROOT="$RUNNER_TEMP/handoffprobe-reproducibility"
          SOURCE_TAR="$REPRO_ROOT/source.tar"
          BUILD_A="$REPRO_ROOT/build-a"
          BUILD_B="$REPRO_ROOT/build-b"
          OUT_A="$REPRO_ROOT/out-a"
          OUT_B="$REPRO_ROOT/out-b"

          rm -rf "$REPRO_ROOT"
          mkdir -p "$BUILD_A" "$BUILD_B" "$OUT_A" "$OUT_B"

          git archive "$GITHUB_SHA" > "$SOURCE_TAR"
          tar -xf "$SOURCE_TAR" -C "$BUILD_A"
          tar -xf "$SOURCE_TAR" -C "$BUILD_B"

          (
            cd "$BUILD_A"
            npm ci
            npm pack --pack-destination "$OUT_A"
          )

          (
            cd "$BUILD_B"
            npm ci
            npm pack --pack-destination "$OUT_B"
          )

          REPRO_A="$OUT_A/handoffprobe-$PACKAGE_VERSION.tgz"
          REPRO_B="$OUT_B/handoffprobe-$PACKAGE_VERSION.tgz"

          test -f "$REPRO_A"
          test -f "$REPRO_B"
          test -f "$TARBALL"

          SHA_A="$(sha256sum "$REPRO_A" | awk '{print $1}')"
          SHA_B="$(sha256sum "$REPRO_B" | awk '{print $1}')"
          RC_SHA="$(sha256sum "$TARBALL" | awk '{print $1}')"

          echo "Release candidate SHA-256: $RC_SHA"
          echo "Rebuild A SHA-256: $SHA_A"
          echo "Rebuild B SHA-256: $SHA_B"

          MANIFEST_A="$REPRO_ROOT/manifest-a.txt"
          MANIFEST_B="$REPRO_ROOT/manifest-b.txt"

          tar -tzf "$REPRO_A" | sort > "$MANIFEST_A"
          tar -tzf "$REPRO_B" | sort > "$MANIFEST_B"

          test "$SHA_A" = "$SHA_B"
          test "$RC_SHA" = "$SHA_A"

          cmp -s "$REPRO_A" "$REPRO_B"
          cmp -s "$TARBALL" "$REPRO_A"
          cmp -s "$MANIFEST_A" "$MANIFEST_B"

          echo "Release artifact reproducibility: PASS"

      - name: Generate and compare release SBOM
        shell: bash
        run: |
          set -euo pipefail

          SBOM_DIR="$RUNNER_TEMP/handoffprobe-release-sbom"
          SBOM_A="$SBOM_DIR/release-a.spdx.json"
          SBOM_B="$SBOM_DIR/release-b.spdx.json"
          COMPARE_A="$SBOM_DIR/compare-a.json"
          COMPARE_B="$SBOM_DIR/compare-b.json"

          rm -rf "$SBOM_DIR"
          mkdir -p "$SBOM_DIR"

          ./node_modules/.bin/tsx scripts/release-sbom.ts \
            --output "$SBOM_A" \
            --comparison-output "$COMPARE_A"

          ./node_modules/.bin/tsx scripts/release-sbom.ts \
            --output "$SBOM_B" \
            --comparison-output "$COMPARE_B"

          test -s "$SBOM_A"
          test -s "$SBOM_B"
          test -s "$COMPARE_A"
          test -s "$COMPARE_B"

          cmp -s "$COMPARE_A" "$COMPARE_B"

          SBOM_SHA="$(sha256sum "$SBOM_A" | awk '{print $1}')"
          FINGERPRINT_SHA="$(sha256sum "$COMPARE_A" | awk '{print $1}')"

          echo "Release SBOM SHA-256: $SBOM_SHA"
          echo "Release SBOM dependency fingerprint SHA-256: $FINGERPRINT_SHA"
          echo "Release SBOM dependency fingerprint reproducibility: PASS"

      - name: Upload merged-main release SBOM
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: handoffprobe-release-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/handoffprobe-release-sbom/release-a.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Inspect release candidate payload
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$RUNNER_TEMP/handoffprobe-release-candidate-manifest.txt"

          tar -tzf "$TARBALL" | sort > "$MANIFEST"

          grep -Fx "package/LICENSE" "$MANIFEST"
          grep -Fx "package/DISCLOSURE" "$MANIFEST"
          grep -Fx "package/README.md" "$MANIFEST"
          grep -Fx "package/package.json" "$MANIFEST"
          grep -Fx "package/dist/cli.js" "$MANIFEST"
          grep -Fx "package/dist/index.js" "$MANIFEST"

          if grep -E "^package/(src|tests|docs|scripts|\.github)/" "$MANIFEST"; then
            echo "Forbidden repository material found in release candidate."
            exit 1
          fi

          if grep -E "^package/(package-lock\.json|compatibility-matrix\.json|action\.yml)$" "$MANIFEST"; then
            echo "Forbidden release payload file found."
            exit 1
          fi

          echo "Payload files: $(wc -l < "$MANIFEST" | tr -d " ")"

      - name: Install and execute release candidate
        shell: bash
        run: |
          set -euo pipefail

          INSTALL_DIR="$RUNNER_TEMP/handoffprobe-release-candidate-install"
          mkdir -p "$INSTALL_DIR"
          cd "$INSTALL_DIR"

          npm init --yes >/dev/null
          npm install --ignore-scripts "$TARBALL"

          VERSION_OUTPUT="$(./node_modules/.bin/handoffprobe --version)"
          echo "$VERSION_OUTPUT"

          test "$VERSION_OUTPUT" = "HandoffProbe $PACKAGE_VERSION"

          ./node_modules/.bin/handoffprobe test --target secure

      - name: Verify repository remained clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
