name: Temporary qs lockfile remediation

on:
  push:
    branches:
      - fix/qs-6.16.0-20260908

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/qs-6.16.0-20260908
          persist-credentials: true

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Update only qs in the lockfile
        run: npm update qs --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify patched qs version
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const version = lock.packages?.['node_modules/qs']?.version;
          if (version !== '6.16.0') {
            throw new Error(`Expected qs 6.16.0, found ${version ?? 'missing'}`);
          }
          console.log(`Verified qs ${version}`);
          NODE

      - name: Verify clean install and quality gates
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run package:check

      - name: Remove temporary workflow and commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-fix-qs-lock.yml
          git add package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No remediation changes to commit"
            exit 1
          fi
          git commit -m "fix: update qs to 6.16.0"
          git push origin HEAD:fix/qs-6.16.0-20260908
